appId: com.vectorforge.photoforge
productName: PhotoForge Studio
icon: desktop/vectorforge-icon.svg
artifactName: PhotoForge-${version}-${arch}-setup.${ext}
directories:
  output: release-photoforge
files:
  - desktop/photoforge-main.cjs
  - package.json
  - '!node_modules/**/*'
extraMetadata:
  main: desktop/photoforge-main.cjs
asar: true
compression: store
win:
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - portable
    - nsis
portable:
  artifactName: PhotoForge-${version}-${arch}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
