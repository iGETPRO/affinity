appId: com.vectorforge.vector
productName: VectorForge
icon: desktop/vectorforge-icon.svg
artifactName: VectorForge-${version}-${arch}-setup.${ext}
directories:
  output: release-vectorforge
files:
  - desktop/vectorforge-main.cjs
  - desktop/vectorforge-icon.svg
  - package.json
  - '!node_modules/**/*'
extraMetadata:
  main: desktop/vectorforge-main.cjs
asar: true
compression: store
win:
  target:
    - portable
    - nsis
  signAndEditExecutable: false
portable:
  artifactName: VectorForge-${version}-${arch}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
